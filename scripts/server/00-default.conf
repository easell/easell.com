# 默认站点（catch-all）—— 2026-11-14 体检后新增
#
# 背景：原先 80 口的 easell server 带 default_server + server_name "_"，
#       任何解析到本机 IP 的陌生域名（测试域、废弃域、别人恶意指过来）都会拿到
#       易采通整站 —— 等于免费给别人做了一个镜像站，搜索引擎可能判重复内容。
#
# 策略：不属于已知域名的请求一律 444（直接断开，不返回任何字节），
#       只保留 ACME 验证通道，方便以后给新域名签 Let's Encrypt 证书。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ { root /var/www/acme; }
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # 443 必须配证书才能握手；用 easell 的证书，握手后立即断开
    ssl_certificate     /etc/letsencrypt/live/easell.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easell.com/privkey.pem;

    return 444;
}
