# 易采通官网 nginx 配置（阿里云 ECS，Ubuntu/Debian）
# 放到 /etc/nginx/sites-available/easell.conf 并软链到 sites-enabled
# 证书签发完成前先注释掉 443 块，用 80 块的 /.well-known/acme-challenge 完成 webroot 签发后再启用

# ── 根域 301 → www（备案核查与统一入口都需要）────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name easell.com;

    # acme.sh webroot 签发/续签
    location /.well-known/acme-challenge/ { root /var/www/acme; }

    location / { return 301 https://www.easell.com$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.easell.com;

    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://www.easell.com$request_uri; }
}

# ── HTTPS 主站 ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.easell.com;

    # acme.sh 签出的证书路径（按实际路径改）
    ssl_certificate     /etc/ssl/easell/fullchain.pem;
    ssl_certificate_key /etc/ssl/easell/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/easell/dist;
    index index.html;

    # 安全与缓存响应头（与 CF 版 _headers 口径一致）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # 静态资源缓存（与 CF 版一致：/img 一周、favicon 30 天、html 不缓存）
    location /img/ { add_header Cache-Control "public, max-age=604800"; }
    location = /favicon.ico { add_header Cache-Control "public, max-age=2592000"; }
    location = /apple-touch-icon.png { add_header Cache-Control "public, max-age=2592000"; }

    # Astro 产物为 目录/index.html 结构；无尾斜杠也能命中
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # 留言接口 → 本机 Node 服务（systemd: easell-contact.service）
    location = /api/contact {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 1m;
    }
}
